app = "project-atlas-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  worker = "celery -A app.workers.simulation_worker worker --loglevel=info --concurrency=1 --queues=simulation"

[[http_service.checks]]
  grace_period = "40s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "10s"